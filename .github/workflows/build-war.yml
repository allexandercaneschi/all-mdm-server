# ALL MDM: compila o painel (WAR) com a marca da ALL Tecnologias.
#
# A versão fica no arquivo ALL_VERSION (ex.: 5.41.1-all.1).
# - Todo push na branch "all-branding" compila e guarda o WAR como artefato do workflow.
# - Se ainda não existir release para a versão do ALL_VERSION, cria a tag v<versão>
#   e publica o WAR no Releases, de onde a imagem Docker (repositório all-mdm) baixa o painel.
#   Para lançar uma versão nova: altere ALL_VERSION e faça push.
name: Build ALL MDM WAR

on:
  push:
    branches: [all-branding]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Compilar
        run: |
          cp server/build.properties.example server/build.properties
          mvn -B -DskipTests install

      - name: Versão
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d ' \r\n' < ALL_VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p dist
          cp server/target/launcher.war "dist/all-mdm-${VERSION}.war"
          (cd dist && sha256sum *.war > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: all-mdm-war-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: dist/*

      - name: Publicar no Releases
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ALL MDM painel ${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
